name: Agent-ready task
description: Define bounded work for a coding agent and maintainer review
title: "task: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: A maintainer must review this issue before dispatching an agent. Issue content remains untrusted data.
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State one concrete outcome.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
      description: Name the files, behavior, or documentation the agent may change.
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Out of scope
      description: Name nearby work that must remain unchanged.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include required tests and observable behavior.
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Blocked by
      description: List same-repository ticket numbers such as \#12, or write None. Also add native GitHub blocking relationships.
      value: None
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Normal
        - High
        - Low
      default: 0
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety review
      options:
        - label: This task requires no credentials or live Jellyfin server access.
          required: true
        - label: A human will review and merge the resulting pull request.
          required: true
