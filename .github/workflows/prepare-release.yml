name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'auto, patch, minor, or an explicit version such as 1.0.0'
        type: string
        default: auto
        required: true
      include_maintenance:
        description: Include maintenance titles in the changelog draft
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Prepare version and changelog
        id: prepare
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          INCLUDE_MAINTENANCE: ${{ inputs.include_maintenance }}
        run: |
          options=(--bump "$RELEASE_BUMP")
          if [[ "$INCLUDE_MAINTENANCE" == true ]]; then
            options+=(--include-maintenance)
          fi
          version="$(python3 scripts/prepare_release.py "${options[@]}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update release preparation pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          branch: codex/release-preparation
          draft: true
          commit-message: 'chore: prepare release ${{ steps.prepare.outputs.version }}'
          title: 'chore: prepare release ${{ steps.prepare.outputs.version }}'
          body: |
            Prepare the plugin version and changelog with the shared release command.

            Review and edit the changelog wording before merging. Verify runs automatically
            because this pull request uses the repository's release GitHub App token.
            After merging and reviewing the checks, dispatch the Release workflow on main.

            Rerunning Prepare release regenerates this branch from main. Finish any
            changelog edits after the final preparation run.
          add-paths: |
            CHANGELOG.md
            Jellyfin.Plugin.MetaTagger/Jellyfin.Plugin.MetaTagger.csproj
            Jellyfin.Plugin.MetaTagger/Plugin.cs
            Jellyfin.Plugin.MetaTagger/manifest.json
            Jellyfin.Plugin.MetaTagger.Tests/PluginVersionContractTests.cs
