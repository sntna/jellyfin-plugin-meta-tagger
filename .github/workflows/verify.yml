name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Verify
        run: ./scripts/build-and-test.sh
      - name: Test release ZIP lifecycle on Linux Docker
        env:
          META_TAGGER_DOCKER_CONTEXT: ""
          META_TAGGER_REPOSITORY_BIND_ADDRESS: "0.0.0.0"
        run: |
          python3 scripts/disposable-jellyfin.py create
          ./scripts/test-release-lifecycle.sh
      - name: Verify release assets reuse the tested ZIP
        run: |
          release_tag="$(PYTHONPATH=scripts python3 -c 'from package_release import _project_versions; print("v" + _project_versions()[0])')"
          python3 scripts/package_release.py \
            --repository "https://github.com/$GITHUB_REPOSITORY" \
            --tag "$release_tag" --tested-repository .jellyfin-test/repository \
            --output artifacts/release-check
          cmp artifacts/release-check/meta-tagger_*.zip .jellyfin-test/repository/meta-tagger_*.zip
