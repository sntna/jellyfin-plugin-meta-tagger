name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Validate release commit and version
        id: version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_EVENT" == workflow_dispatch && "$RELEASE_REF" != refs/heads/main ]]; then
            echo 'Manual releases must run from main.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          release_tag="$(python3 scripts/release_tag.py)"
          if [[ "$RELEASE_EVENT" == push && "$RELEASE_REF" != "refs/tags/$release_tag" ]]; then
            echo 'Pushed tag does not match the project version.' >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Extract reviewed release notes
        run: python3 scripts/release_notes.py > "$RUNNER_TEMP/release-notes.md"
      - name: Verify
        run: ./scripts/build-and-test.sh
      - name: Create disposable Jellyfin server
        env:
          META_TAGGER_DOCKER_CONTEXT: ""
        run: python3 scripts/disposable-jellyfin.py create
      - name: Test release ZIP lifecycle
        env:
          META_TAGGER_DOCKER_CONTEXT: ""
          META_TAGGER_REPOSITORY_BIND_ADDRESS: "0.0.0.0"
        run: ./scripts/test-release-lifecycle.sh
      - name: Prepare release assets from tested ZIP
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: >-
          python3 scripts/package_release.py
          --repository "$RELEASE_REPOSITORY"
          --tag "$RELEASE_TAG"
          --tested-repository .jellyfin-test/repository
          --output artifacts
      - name: Confirm the tested ZIP is the published ZIP
        run: cmp artifacts/meta-tagger_*.zip .jellyfin-test/repository/meta-tagger_*.zip
      - name: Create release tag if needed
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          fi
      - name: Validate remote release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(python3 scripts/release_tag.py)" = "$RELEASE_TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: ./scripts/publish_release.sh "$RELEASE_TAG" artifacts "$RUNNER_TEMP/release-notes.md"
