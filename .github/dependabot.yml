version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: weekly
    labels:
      - dependencies
